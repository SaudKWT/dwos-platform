<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — Vessel Movement Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #c9d6e8;
  }

  .card {
    width: 100%;
    max-width: 360px;
    margin: 1rem;
    background: #111d30;
    border: 1px solid #1e3050;
    border-radius: 12px;
    padding: 2.5rem 2rem 2rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }

  .logo {
    text-align: center;
    margin-bottom: 2rem;
  }

  .logo-icon {
    font-size: 2.4rem;
    display: block;
    margin-bottom: .5rem;
  }

  .logo h1 {
    font-size: 1.15rem;
    font-weight: 600;
    color: #e8f0ff;
    letter-spacing: .02em;
  }

  .logo p {
    font-size: .78rem;
    color: #5a7a9e;
    margin-top: .25rem;
  }

  label {
    display: block;
    font-size: .8rem;
    font-weight: 500;
    color: #7a9bbf;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: .4rem;
  }

  input[type="password"] {
    width: 100%;
    padding: .7rem .9rem;
    background: #0b1a2e;
    border: 1px solid #1e3050;
    border-radius: 7px;
    color: #e8f0ff;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }

  input[type="password"]:focus {
    border-color: #2a6fdb;
  }

  button[type="submit"] {
    display: block;
    width: 100%;
    margin-top: 1.25rem;
    padding: .75rem;
    background: #1a5dc8;
    border: none;
    border-radius: 7px;
    color: #fff;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: .03em;
    transition: background .2s;
  }

  button[type="submit"]:hover { background: #1a6de8; }
  button[type="submit"]:active { background: #1450b0; }
  button[type="submit"]:disabled { background: #1a3a6e; color: #5a7a9e; cursor: not-allowed; }

  .error {
    margin-top: .9rem;
    padding: .6rem .9rem;
    background: rgba(200,40,40,.15);
    border: 1px solid rgba(200,40,40,.35);
    border-radius: 6px;
    color: #f08080;
    font-size: .85rem;
    display: none;
  }

  .error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">⚓</span>
    <h1>Vessel Movement Tracker</h1>
    <p>Shuaiba · North Port · OPH · OD-1</p>
  </div>

  <form id="loginForm">
    <label for="pwd">Access Password</label>
    <input id="pwd" name="password" type="password" placeholder="Enter password"
           autocomplete="current-password" autofocus required />
    <button type="submit" id="btn">Sign In</button>
    <div class="error" id="errMsg">Incorrect password. Try again.</div>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const btn  = document.getElementById('btn');
const err  = document.getElementById('errMsg');

// Where to go after a successful login (from ?next= param).
const next = new URLSearchParams(location.search).get('next') || '/';

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.remove('visible');
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const password = document.getElementById('pwd').value;

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });

    if (res.ok) {
      location.href = next;
    } else {
      err.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      document.getElementById('pwd').select();
    }
  } catch {
    err.textContent = 'Network error. Check your connection.';
    err.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});
</script>
</body>
</html>
