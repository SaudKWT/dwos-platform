<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vessel Movement Simulator — Shuaiba / North Port / OPH / OD-1</title>
<script>
  try {
    const t = localStorage.getItem('vesselSimTheme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header>
    <h1>Vessel Movement Simulator</h1>
    <span class="pill" id="dataRange">loading…</span>
    <span class="pill">Kuwait (UTC+3)</span>
    <span id="liveIndicator" class="live-indicator" hidden><span class="live-dot"></span>LIVE</span>
    <span style="flex:1"></span>
    <button id="themeBtn" class="theme-btn" title="Toggle theme">☀ Light</button>
    <span class="clock" id="clock">—</span>
  </header>

  <div id="map"></div>

  <aside>
    <section class="controls">
      <h2>Time</h2>
      <div class="row">
        <input id="slider" type="range" min="0" max="1000" value="0" step="1" />
      </div>
      <div class="row">
        <button id="btnPrevDay" title="−1 day">⏮ Day</button>
        <button id="btnPrevHour" title="−1 hour">−1h</button>
        <button id="btnPlay" class="primary">▶ Play</button>
        <button id="btnNextHour" title="+1 hour">+1h</button>
        <button id="btnNextDay" title="+1 day">Day ⏭</button>
      </div>
      <div class="row">
        <button id="btnLive" class="live-btn" title="Toggle live AIS tracking">● Live</button>
        <span id="liveStatus" class="live-status">Off</span>
      </div>
      <div class="row">
        <label class="cb">Speed
          <select id="speed">
            <option value="60">1× (1 min/sec)</option>
            <option value="300">5×</option>
            <option value="1800" selected>30× (30 min/sec)</option>
            <option value="3600">60× (1 hr/sec)</option>
            <option value="14400">240×</option>
          </select>
        </label>
        <label class="cb"><input id="cbRoutes" type="checkbox" checked /> Show routes</label>
      </div>
      <div class="row">
        <label class="cb" title="Overlay real AIS positions (when imported via tools/import_ais_history.py)">
          <input id="cbAisTrack" type="checkbox" /> Show real AIS track
        </label>
        <span id="aisStatus" class="live-status" hidden>—</span>
      </div>
    </section>

    <section>
      <h2>Vessel Status</h2>
      <div id="vesselCards"></div>
    </section>

    <section>
      <h2>Legend</h2>
      <div class="legend" id="legend"></div>
      <footer class="note" id="notes"></footer>
    </section>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.local.js"></script>
<script src="app.js"></script>
</body>
</html>
